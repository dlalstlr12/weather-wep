server:
  port: 8080
  http2:
    enabled: true
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024
  tomcat:
    threads:
      max: 50
      min-spare: 5
    accept-count: 100

spring:
  application:
    name: weather-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weather_db}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

anthropic:
  # 비어 있으면 LLM 없이 규칙 기반 답변만 쓴다. 키는 환경변수로만 넣는다
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-5-5
  # 비용 상한: 응답 최대 토큰, 질문당 모델 호출 횟수, 보내는 대화 길이, 하루 사용 횟수
  max-tokens: 400
  max-model-calls: 4
  max-history: 6
  max-message-chars: 500
  daily-limit-per-user: 10
  daily-limit-total: 100

kma:
  service-key: ${KMA_SERVICE_KEY:}
  # 연결/응답 대기 제한(ms). 이 시간 안에 응답이 없으면 끊고 재시도 또는 오류 처리한다
  http:
    connect-timeout-ms: 1000
    read-timeout-ms: 2000
  # ttl 안에는 캐시를 그대로 쓰고, 갱신에 실패하면 stale-max까지는 지난 값을 대신 준다
  cache:
    ttl-seconds: 600
    stale-max-seconds: 10800
    max-size: 1000
  # 재시도는 첫 시도를 포함한 총 횟수. 서킷 브레이커는 최근 window-size개 호출 중 실패율이 기준을 넘으면 open-ms 동안 호출을 막는다
  resilience:
    retry-max-attempts: 2
    retry-wait-ms: 200
    breaker-window-size: 20
    breaker-minimum-calls: 10
    breaker-failure-rate-percent: 50
    breaker-open-ms: 10000
  # provider: data (기본, data.go.kr) | hub (기상청 API Hub)
  provider: hub
  # data.go.kr 기본 base-url (사용 중인 엔드포인트)
  data:
    base-url: https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0
  # 기상청 API Hub 설정 (사용 전 실제 경로/헤더명을 확인해 수정하세요)
  hub:
    base-url: https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
    auth:
      mode: query        # header | query
      header-name: x-api-key
      query-name: authKey
