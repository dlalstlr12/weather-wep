services:
  db:
    image: postgis/postgis:16-3.4
    container_name: weather-postgres
    environment:
      - POSTGRES_DB=weather_db
      - POSTGRES_USER=${POSTGRES_USER:-weather}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - TZ=Asia/Seoul
    # Expose only inside compose network to avoid host port conflicts.
    # If you need host access, map to a free port like "5433:5432".
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d weather_db"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - web

  backend:
    build:
      context: ./backend
    image: weather/backend:latest
    env_file:
      - .env
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set (32+ chars)}
      - JWT_EXPIRATION_MS=${JWT_EXPIRATION_MS:-604800000}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/weather_db
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-weather}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - JAVA_OPTS=
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - web

  frontend:
    build:
      context: ./frontend
    image: weather/frontend:latest
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - web

  # 관측 스택: docker compose --profile observability up -d
  # 백엔드의 측정값은 관리 포트(8081)로만 열리며 compose 네트워크 안에서만 접근된다.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
    networks:
      - web

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["observability"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # 로컬 확인용: 로그인 없이 보기만 가능
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - web

volumes:
  db_data:

networks:
  web:
    driver: bridge
